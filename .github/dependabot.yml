version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Laisse à la communauté le temps de repérer une version compromise, plus longtemps pour une majeure.
    # Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # La majeure de @types/node suit celle de Node en prod, montée à la main avec le runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # oidc-provider >= 9.12 exige une durée de vie finie pour le refresh token et le grant,
      # or ceux de l'invité n'expirent jamais : à lever une fois cette durée choisie.
      - dependency-name: 'oidc-provider'
        versions: ['>=9.12.0']
      - dependency-name: '@types/oidc-provider'
        versions: ['>=9.12.0']
    groups:
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      prod-major:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - major
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
      dev-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(docker):'
    # Images qui doublent les addons Scalingo : leur version suit celle de la prod, pas la dernière publiée
    ignore:
      - dependency-name: 'redis'
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
