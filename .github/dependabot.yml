version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Majeures npm montées hors Dependabot : elles demandent souvent une refacto.
    # Sans effet sur les security updates, créées quel que soit le type de montée.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    # Laisse à la communauté le temps de repérer une version compromise. Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
    groups:
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
