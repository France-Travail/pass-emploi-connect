name: Tests and Quality Checks

on:
  push:
    branches: [develop, master]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/lint-and-typecheck@fa25f0e00d1a842ac9007d3f0d56cc78911c542e
        with:
          # yarn build ne typecheck pas test/
          build-command: yarn tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6767:6379

    env:
      REDIS_URL: redis://localhost:6767

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/test-and-upload@fa25f0e00d1a842ac9007d3f0d56cc78911c542e
        with:
          test-command: 'yarn test:ci'

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    # 49699333 = Dependabot bot user ID
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.user.id != 49699333

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/sonarqube-scan@fa25f0e00d1a842ac9007d3f0d56cc78911c542e
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
